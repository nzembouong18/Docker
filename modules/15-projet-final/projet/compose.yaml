name: todo

x-logging: &logging
  driver: local
  options: { max-size: "10m", max-file: "3" }

services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      api: { condition: service_healthy }
    networks: [front]
    logging: *logging
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]

  api:
    build:
      context: ./api
      target: runtime
    image: ${REGISTRY:-local}/todo-api:${TAG:-dev}
    environment:
      DATABASE_URL: postgresql://todo:${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}@db:5432/todo
    depends_on:
      db: { condition: service_healthy }
    networks: [front, back]
    logging: *logging
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [back]
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  front:
  back:
    internal: true

volumes:
  pgdata:
