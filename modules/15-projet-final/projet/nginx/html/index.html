<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Todo Docker</title>
<style>body{font-family:system-ui;max-width:32rem;margin:2rem auto;padding:0 1rem}li{cursor:pointer}li.done{text-decoration:line-through;opacity:.6}</style></head>
<body>
<h1>📝 Todo (projet final Docker)</h1>
<form id="f"><input id="t" placeholder="Nouvelle tâche" required> <button>Ajouter</button></form>
<ul id="l"></ul>
<script>
const load = async () => {
  const todos = await (await fetch('/api/todos')).json();
  l.innerHTML = todos.map(t => `<li class="${t.done ? 'done' : ''}" data-id="${t.id}">${t.title.replace(/</g,'&lt;')}</li>`).join('');
};
f.onsubmit = async e => { e.preventDefault();
  await fetch('/api/todos', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({title:t.value})});
  t.value=''; load(); };
l.onclick = async e => { if (e.target.dataset.id) { await fetch('/api/todos/'+e.target.dataset.id, {method:'PATCH'}); load(); } };
load();
</script>
</body></html>
