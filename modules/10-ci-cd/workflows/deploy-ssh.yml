# Déploiement simple par SSH + Docker Compose (petit serveur mono-hôte)
name: deploy
on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

concurrency: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production           # protections + secrets d'environnement
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Ajouter l'hôte connu
        run: ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      - name: Déployer via contexte Docker distant
        env:
          DOCKER_HOST: ssh://${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          TAG: ${{ github.ref_name }}
        run: |
          docker compose -f compose.yaml -f compose.prod.yaml pull
          docker compose -f compose.yaml -f compose.prod.yaml up -d --wait --remove-orphans
          docker image prune -f
