# Tests d'intégration avec Docker Compose
name: integration-tests
on: [pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - run: docker compose config -q

  integration:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Démarrer la stack et attendre les healthchecks
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Smoke tests
        run: |
          curl -fsS localhost:8080/health
          curl -fsS localhost:8080/ | tee /dev/stderr | grep -q visits
      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs --no-color
      - name: Nettoyage
        if: always()
        run: docker compose down -v
